name: Tests and ML containers

on:
  pull_request:
  push:
    branches: [main, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/retail-ci-matplotlib
  OPENBLAS_NUM_THREADS: '2'
  OMP_NUM_THREADS: '2'
  MLFLOW_ENABLE_TELEMETRY: 'false'
  MLFLOW_DISABLE_AGENT_HINT: '1'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group notebooks
      - run: uv lock --check
      - run: uv run --locked ruff check src scripts tests
      - run: uv run --locked ruff format --check src scripts tests
      - run: uv run --locked pytest -q

  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: inference
            smoke: tests/container_smoke.py
          - target: training
            smoke: tests/training_container_smoke.py
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Build image (no model or dataset embedded)
        run: docker build --pull --target ${{ matrix.target }} --build-arg VCS_REF=${{ github.sha }} --tag online-retail:${{ github.sha }}-${{ matrix.target }} .
      - name: Check host/container parity and failure handling
        run: uv run --locked python ${{ matrix.smoke }} --image online-retail:${{ github.sha }}-${{ matrix.target }} --report artifacts/ci/${{ matrix.target }}-smoke.json

  sagemaker-contracts:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.15'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - name: Build SageMaker training adapter
        run: docker build --target sagemaker-training --build-arg VCS_REF=${{ github.sha }} --tag online-retail:${{ github.sha }}-sm-training .
      - name: Build SageMaker Batch Transform adapter
        run: docker build --target sagemaker-inference --build-arg VCS_REF=${{ github.sha }} --tag online-retail:${{ github.sha }}-sm-inference .
      - name: Emulate training artifact and Batch Transform HTTP contracts
        run: uv run --locked python tests/sagemaker_container_smoke.py --training-image online-retail:${{ github.sha }}-sm-training --inference-image online-retail:${{ github.sha }}-sm-inference --report artifacts/ci/sagemaker-contracts.json
